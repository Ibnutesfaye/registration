<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="form.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- Login Form -->
        <form id="loginForm">
            <h2>Login</h2>

            <div class="input-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>

            <button type="submit">Login If You Have An Account</button>

            <div class="toggle">
                Don't have an account? <span id="showRegister">Register Your Account</span>
            </div>

            <div class="message" id="loginMessage"></div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <h2>Register</h2>

            <div class="input-group">
                <label for="regUsername">Name</label>
                <input type="text" id="regUsername" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" required autocomplete="email">
            </div>

            <div class="input-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" required autocomplete="new-password">
            </div>

            <button type="submit">Register</button>

            <div class="toggle">
                Already have an account? <span id="showLogin">Login</span>
            </div>

            <div class="message" id="registerMessage"></div>
        </form>

    </div>

</body>

</html>
