<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="form.css" >
</head>
<body>

<div class="container">

    <!-- Login Form -->
    <form id="loginForm">
        <h2>Login</h2>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required>
        </div>

        <button type="submit">Login</button>

        <div class="toggle">
            Don't have an account? <span onclick="showRegister()">Register</span>
        </div>

        <div class="message" id="loginMessage"></div>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="hidden">
        <h2>Register</h2>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="regUsername" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="regEmail" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPassword" required>
        </div>

        <button type="submit">Register</button>

        <div class="toggle">
            Already have an account? <span onclick="showLogin()">Login</span>
        </div>

        <div class="message" id="registerMessage"></div>
    </form>

</div>

<script>
    function showRegister() {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("registerForm").classList.remove("hidden");
    }

    function showLogin() {
        document.getElementById("registerForm").classList.add("hidden");
        document.getElementById("loginForm").classList.remove("hidden");
    }

    // Registration
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const username = document.getElementById("regUsername").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;

        if (username && email && password) {
            document.getElementById("registerMessage").style.color = "green";
            document.getElementById("registerMessage").innerText = "Registration successful!";
            showLogin();
        } else {
            document.getElementById("registerMessage").innerText = "Please fill all fields.";
        }
    });

    // Login
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (email && password) {
            document.getElementById("loginMessage").style.color = "green";
            document.getElementById("loginMessage").innerText = "Login successful!";
        } else {
            document.getElementById("loginMessage").innerText = "Invalid login details.";
        }
    });
</script>

</body>
</html>
